version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - go
    commit-message:
      prefix: deps
      include: scope
    groups:
      go-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - frontend
    commit-message:
      prefix: deps
      include: scope
    groups:
      npm-dev-dependencies:
        dependency-type: development
        # typescript bumps alone until typescript-eslint supports TS 7 — see CLAUDE.md
        exclude-patterns:
          - "typescript"
      npm-prod-dependencies:
        dependency-type: production
    ignore:
      # TS 7 breaks @typescript-eslint's peer range (typescript >=4.8.4 <6.1.0).
      # Drop this once typescript-eslint ships TS 7 support — see CLAUDE.md.
      - dependency-name: typescript
        versions: [">=7"]

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: deps
      include: scope
    groups:
      docker-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
