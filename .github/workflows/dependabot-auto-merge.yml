name: Dependabot auto-merge

# Enables GitHub auto-merge on Dependabot PRs for patch + minor bumps and
# Docker digest-only bumps. The merge only fires once required status checks
# (Test workflow) pass, so this never bypasses CI. Real major bumps are left
# for manual review.
#
# Prerequisites in repo Settings:
#   - "Allow auto-merge" enabled (Settings → General → Pull Requests)
#   - A branch protection rule on `main` requiring the Test workflow,
#     otherwise `gh pr merge --auto` errors with "Branch is not protected".

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # A Docker digest bump keeps the tag and only moves the @sha256 pin, so there
      # is no version to compare: fetch-metadata reports semver-major with
      # previous-version = `<sha>` (its own backtick formatting for a digest) while
      # new-version stays the tag. A genuine major bump has a plain version in both.
      # ponytail: string check instead of diffing the Dockerfile — checking out an
      # untrusted PR ref under pull_request_target costs more than it buys, and if
      # fetch-metadata ever drops the backticks these bumps just stop auto-merging.
      - name: Enable auto-merge for patch + minor + docker digest
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-patch'
          || steps.meta.outputs.update-type == 'version-update:semver-minor'
          || (steps.meta.outputs.package-ecosystem == 'docker'
          && contains(steps.meta.outputs.previous-version, '`'))
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
